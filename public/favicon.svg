<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradients and Effects -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18233c" />
      <stop offset="100%" stop-color="#0a0f1e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcf4d" />
      <stop offset="50%" stop-color="#f0a500" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="needleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#f0a500" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Travel Pin Icon with Compass -->
  <g filter="url(#glow)">
    <!-- Map Pin Outer Body -->
    <path
      d="M32 9C22.61 9 15 16.61 15 26c0 12.2 15.3 26.6 16.15 27.4a1.25 1.25 0 0 0 1.7 0C33.7 52.6 49 38.2 49 26c0-9.39-7.61-17-17-17z"
      fill="url(#goldGrad)"
    />

    <!-- Inner Dark Circle -->
    <circle cx="32" cy="25.5" r="9.5" fill="#0a0f1e" />

    <!-- Compass Needles -->
    <!-- North Needle (Gold) -->
    <polygon points="32,18 34.5,25.5 32,24.5" fill="#ffcf4d" />
    <polygon points="32,18 29.5,25.5 32,24.5" fill="#f0a500" />

    <!-- South Needle (Cyan) -->
    <polygon points="32,33 34.5,25.5 32,26.5" fill="#0284c7" />
    <polygon points="32,33 29.5,25.5 32,26.5" fill="#38bdf8" />

    <!-- East Needle -->
    <polygon points="39.5,25.5 32,23 33,25.5" fill="#ffcf4d" />
    <polygon points="39.5,25.5 32,28 33,25.5" fill="#f0a500" />

    <!-- West Needle -->
    <polygon points="24.5,25.5 32,23 31,25.5" fill="#38bdf8" />
    <polygon points="24.5,25.5 32,28 31,25.5" fill="#0284c7" />

    <!-- Center Pivot Dot -->
    <circle cx="32" cy="25.5" r="2.2" fill="#ffffff" />
    <circle cx="32" cy="25.5" r="1" fill="#0a0f1e" />
  </g>
</svg>